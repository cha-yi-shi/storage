<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="厦大百宝箱：把校园里的常用资源和实用链接收进一个轻巧的工具箱。">
  <title>厦大百宝箱 · 校园资源，一站收藏</title>
  <style>
    :root{color-scheme:light;--paper:#f5f5f2;--ink:#20251f;--muted:#737970;--line:#e3e5de;--green:#17365d;--lime:#c7dcff;--card:#fff;--shadow:0 16px 45px #1d35200c}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:0 28px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em}.mark{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:19px}.nav-note{font-size:13px;color:var(--muted)}.hero{padding:68px 0 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--green);text-transform:uppercase}.hero h1{font-size:clamp(40px,6vw,70px);line-height:1.08;letter-spacing:-.065em;margin:15px 0 18px;max-width:620px}.hero h1 em{font-style:normal;color:var(--green)}.hero p{max-width:490px;color:var(--muted);font-size:16px;margin:0}.orb{height:230px;border-radius:24px;background:var(--green);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--lime);box-shadow:var(--shadow)}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #c7dcff55;border-radius:50%;width:235px;height:235px}.orb:after{width:310px;height:310px}.orbit-word{font-size:74px;font-weight:800;letter-spacing:-.08em;z-index:1}.orbit-caption{position:absolute;right:20px;bottom:17px;color:#d9e6f5;font-size:11px;letter-spacing:.12em}.toolbar{display:flex;align-items:center;gap:12px;padding:20px 0;border-top:1px solid var(--line)}.search{position:relative;flex:1}.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 16px 0 44px;background:#fff;outline:none}.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px #17365d18}.search span{position:absolute;left:16px;top:12px;color:var(--muted)}.filter{height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:13px}.filter.active{background:var(--green);border-color:var(--green);color:white}.count{font-size:12px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:70px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:172px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#bdc9d9}.card-top{display:flex;justify-content:space-between;align-items:center}.icon{width:38px;height:38px;border-radius:12px;background:#eaf0f8;display:grid;place-items:center;font-size:19px}.tag{font-size:11px;color:var(--green);background:#eaf0f8;padding:5px 9px;border-radius:999px}.card h2{font-size:17px;margin:16px 0 4px;letter-spacing:-.025em}.card p{font-size:13px;color:var(--muted);margin:0 0 14px;flex:1}.card-foot{display:flex;justify-content:space-between;align-items:center}.card a{font-size:12px;color:var(--green);font-weight:700;text-decoration:none}.card a:hover{text-decoration:underline}.star{border:0;background:none;color:#b2b7ae;font-size:19px;padding:0 2px}.star.saved{color:#d18d35}.empty{grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px 0 32px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#20251f;color:white;padding:10px 16px;border-radius:10px;font-size:13px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.shell{padding:0 18px}.hero{grid-template-columns:1fr;padding:48px 0 28px;gap:26px}.orb{height:160px}.orbit-word{font-size:58px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.grid{grid-template-columns:1fr 1fr}.nav-note{display:none}}
    @media(max-width:480px){.grid{grid-template-columns:1fr}.filter{padding:0 12px}.count{margin-left:auto}.hero h1{font-size:46px}footer{gap:10px;flex-direction:column}}
  </style>
</head>
<body>
  <header class="shell nav"><div class="brand"><span class="mark">厦</span><span>厦大百宝箱</span></div><div class="nav-note">给校园生活，留一个好用的入口</div></header>
  <main class="shell">
    <section class="hero"><div><div class="eyebrow">XMUTREASURE CHEST · 01</div><h1>校园资源，<br><em>一站收藏。</em></h1><p>把常用工具、校园服务和实用信息收进一个轻巧的百宝箱。搜索一下，马上找到你要的。</p></div><div class="orb" aria-hidden="true"><span class="orbit-word">XM</span><span class="orbit-caption">CAMPUS, IN YOUR POCKET</span></div></section>
    <section aria-label="资源目录"><div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索资源或关键词…" aria-label="搜索资源"></label><button class="filter active" data-filter="全部">全部资源</button><button class="filter" data-filter="校园服务">校园服务</button><button class="filter" data-filter="学习工具">学习工具</button><button class="filter" data-filter="生活指南">生活指南</button><button class="filter" data-filter="收藏">★ 收藏</button><span class="count" id="count"></span></div><div class="grid" id="grid"></div></section>
  </main>
  <footer class="shell"><span>厦大百宝箱 · 持续整理中</span><span>校园资源，随手可达。</span></footer><div class="toast" id="toast" role="status"></div>
  <script>
    // 资源目录集中维护在这里；将网址替换为真实资源即可上线使用。
    const resources=[
      {title:'校园官网',category:'校园服务',icon:'🏛️',description:'学校通知、机构信息与校园新闻。',url:'https://www.xmut.edu.cn/',keywords:'厦门理工 学校 官方 通知'},
      {title:'教务处',category:'校园服务',icon:'📋',description:'查看教学安排、考试与教务相关信息。',url:'https://jwc.xmut.edu.cn/',keywords:'课程 教学 考试 学籍'},
      {title:'图书馆',category:'学习工具',icon:'📚',description:'检索馆藏资源，开启安静的学习时间。',url:'https://lib.xmut.edu.cn/',keywords:'借书 馆藏 文献 自习'},
      {title:'校园地图',category:'生活指南',icon:'🧭',description:'找教学楼、服务点和校园里的下一站。',url:'https://map.baidu.com/',keywords:'地图 导航 地点'},
      {title:'邮件入口',category:'校园服务',icon:'✉️',description:'快速前往学校邮箱，收取重要消息。',url:'https://mail.xmut.edu.cn/',keywords:'邮箱 邮件'},
      {title:'学习计时器',category:'学习工具',icon:'⏱️',description:'用专注时段拆解任务，给学习留出节奏。',url:'https://pomofocus.io/',keywords:'番茄钟 专注 时间管理'},
      {title:'新生办事指南',category:'生活指南',icon:'🎒',description:'整理入学、住宿与校园生活常用信息。',url:'https://www.xmut.edu.cn/',keywords:'新生 入学 宿舍 生活'},
      {title:'校历与假期',category:'校园服务',icon:'🗓️',description:'查看学期节奏，提前安排学习和出行。',url:'https://www.xmut.edu.cn/',keywords:'校历 日历 放假 学期'},
      {title:'常用换算',category:'学习工具',icon:'∑',description:'学习和日常里常见的单位换算工具。',url:'https://www.wolframalpha.com/',keywords:'计算 单位 换算'}
    ];
    const grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count');let selected='全部';
    const saved=()=>JSON.parse(localStorage.getItem('xmu-saved')||'[]');
    function render(){const q=search.value.trim().toLowerCase(),stars=saved();const shown=resources.filter(x=>(selected==='全部'||x.category===selected||(selected==='收藏'&&stars.includes(x.title)))&&(!q||`${x.title} ${x.description} ${x.category} ${x.keywords}`.toLowerCase().includes(q)));count.textContent=`${shown.length} 个入口`;grid.innerHTML=shown.length?shown.map(x=>`<article class="card"><div class="card-top"><span class="icon">${x.icon}</span><span class="tag">${x.category}</span></div><h2>${x.title}</h2><p>${x.description}</p><div class="card-foot"><a href="${x.url}" target="_blank" rel="noopener noreferrer">打开入口 ↗</a><button class="star ${stars.includes(x.title)?'saved':''}" data-star="${x.title}" aria-label="收藏${x.title}" title="收藏">${stars.includes(x.title)?'★':'☆'}</button></div></article>`).join(''):'<div class="empty">没有找到相关入口，试试其他关键词吧。</div>'}
    document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');selected=b.dataset.filter;render()}));search.addEventListener('input',render);grid.addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(!b)return;const list=saved(),name=b.dataset.star;localStorage.setItem('xmu-saved',JSON.stringify(list.includes(name)?list.filter(x=>x!==name):[...list,name]));render();const toast=document.querySelector('#toast');toast.textContent=list.includes(name)?'已取消收藏':'已加入收藏';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)});render();
  </script>
</body>
</html>
